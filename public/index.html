<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinder Bot Command Center</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface2: #1c1c2e;
    --border: #2a2a40;
    --text: #e4e4ef;
    --text-dim: #8888a0;
    --accent: #ff4466;
    --accent2: #ff6b81;
    --green: #44dd88;
    --blue: #4488ff;
    --yellow: #ffcc44;
    --orange: #ff8844;
    --purple: #aa66ff;
    --red: #ff4444;
    --gray: #555570;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #ff4466 0%, #ff6b81 50%, #ff8844 100%);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: white;
    letter-spacing: -0.5px;
  }
  .header-center {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .kill-switch {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0,0,0,0.25);
    padding: 8px 16px;
    border-radius: 24px;
  }
  .kill-label {
    font-size: 13px;
    font-weight: 600;
    color: white;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .toggle {
    position: relative;
    width: 48px;
    height: 26px;
    cursor: pointer;
  }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: var(--red);
    border-radius: 13px;
    transition: all 0.3s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    background: white;
    border-radius: 50%;
    top: 3px;
    left: 3px;
    transition: all 0.3s;
  }
  .toggle.active .toggle-slider {
    background: var(--green);
  }
  .toggle.active .toggle-slider::before {
    transform: translateX(22px);
  }
  .kill-status {
    font-size: 11px;
    font-weight: 700;
    color: white;
    min-width: 28px;
  }
  .kill-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
  }
  .kill-bar-label {
    justify-self: end;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .kill-bar-status {
    justify-self: start;
    font-size: 15px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 6px;
    width: 100px;
    text-align: center;
    box-sizing: border-box;
  }
  .kill-bar-status.on { background: var(--green); color: #000; }
  .kill-bar-status.off { background: var(--red); color: white; }
  .killed-banner {
    background: rgba(255,68,68,0.9);
    color: white;
    text-align: center;
    padding: 8px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    display: none;
  }
  .killed-banner.visible { display: block; }
  .header-stats {
    display: flex;
    gap: 24px;
  }
  .header-stat {
    text-align: center;
    color: rgba(255,255,255,0.9);
  }
  .header-stat .num {
    font-size: 24px;
    font-weight: 700;
    color: white;
  }
  .header-stat .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.8;
  }

  /* Layout */
  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* Sidebar - match list */
  .sidebar {
    width: 320px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    min-height: 0;
  }
  .sidebar-filter {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .filter-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  .match-list {
    flex: 1;
    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: auto;
    min-height: 0;
  }
  .match-item {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .match-item:hover { background: var(--surface2); }
  .match-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }
  .match-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--orange));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: white;
    flex-shrink: 0;
  }
  .match-info { flex: 1; min-width: 0; }
  .match-name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .match-preview {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .match-meta {
    text-align: right;
    flex-shrink: 0;
  }
  .match-time {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  /* Status badges */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-new { background: rgba(68,136,255,0.15); color: var(--blue); }
  .badge-opener_sent { background: rgba(68,136,255,0.15); color: var(--blue); }
  .badge-chatting { background: rgba(68,221,136,0.15); color: var(--green); }
  .badge-date_proposed { background: rgba(255,204,68,0.15); color: var(--yellow); }
  .badge-date_pending { background: rgba(255,136,68,0.15); color: var(--orange); }
  .badge-date_confirmed { background: rgba(68,221,136,0.2); color: var(--green); }
  .badge-date_rejected { background: rgba(255,68,68,0.15); color: var(--red); }
  .badge-ghosted { background: rgba(85,85,112,0.2); color: var(--gray); }
  .badge-unmatched { background: rgba(85,85,112,0.2); color: var(--gray); }
  .badge-stopped { background: rgba(85,85,112,0.2); color: var(--gray); }

  /* Main content */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  #tab-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  /* Empty state */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state p { font-size: 16px; }

  /* Match detail header */
  .detail-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .detail-header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .detail-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--orange));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 20px;
    color: white;
  }
  .detail-name { font-size: 18px; font-weight: 700; }
  .detail-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .detail-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Buttons */
  .btn {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-success { background: var(--green); color: #000; }
  .btn-success:hover { opacity: 0.85; }
  .btn-warning { background: var(--yellow); color: #000; }
  .btn-warning:hover { opacity: 0.85; }
  .btn-danger { background: var(--red); color: white; }
  .btn-danger:hover { opacity: 0.85; }
  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }

  /* Tabs */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    padding: 0 24px;
    flex-shrink: 0;
  }
  .tab {
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Conversation view */
  .conversation {
    flex: 1;
    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: auto;
    padding: 24px;
    min-height: 0;
  }
  .convo-inner {
    min-height: calc(100% + 1px);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 12px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    position: relative;
  }
  .msg-bot {
    align-self: flex-end;
    background: var(--accent);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg-match {
    align-self: flex-start;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg-time {
    font-size: 10px;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
  }
  .msg-match .msg-time { color: var(--text-dim); }

  /* Message input */
  .msg-input-bar {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .msg-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .msg-input:focus { border-color: var(--accent); }
  .msg-input::placeholder { color: var(--text-dim); }

  /* Profile panel */
  .profile-panel {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  .profile-section {
    margin-bottom: 24px;
  }
  .profile-section h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .profile-section p, .profile-section pre {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }
  .profile-section pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--surface2);
    padding: 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .stat-card .value {
    font-size: 22px;
    font-weight: 700;
  }
  .stat-card .label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  /* Alert banner */
  .alert-banner {
    background: rgba(255,136,68,0.1);
    border: 1px solid rgba(255,136,68,0.3);
    border-radius: 8px;
    padding: 12px 16px;
    margin: 16px 24px 0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .alert-banner .alert-icon { font-size: 20px; }
  .alert-banner .alert-text { font-size: 13px; color: var(--orange); flex: 1; }
  .alert-banner .alert-actions { display: flex; gap: 8px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gray); }

  /* No matches */
  .no-matches {
    padding: 40px 16px;
    text-align: center;
    color: var(--text-dim);
  }

  /* Action required pulse */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .needs-action { animation: pulse 2s infinite; }
</style>
</head>
<body>

<div class="header">
  <h1>Tinder Bot <span style="font-size:12px;font-weight:400;opacity:0.7;margin-left:6px;">Command Center</span></h1>
  <div class="header-stats">
    <div class="header-stat">
      <div class="num" id="stat-total">-</div>
      <div class="label">Matches</div>
    </div>
    <div class="header-stat">
      <div class="num" id="stat-messages">-</div>
      <div class="label">Messages</div>
    </div>
    <div class="header-stat">
      <div class="num" id="stat-dates">-</div>
      <div class="label">Dates</div>
    </div>
  </div>
</div>

<div class="kill-bar">
  <span class="kill-bar-label">Kill Switch</span>
  <div class="toggle active" id="kill-toggle" onclick="handleKillSwitch()">
    <span class="toggle-slider"></span>
  </div>
  <span class="kill-bar-status on" id="kill-bar-status">ACTIVE</span>
</div>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-filter">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="dates">Dates</button>
      <button class="filter-btn" data-filter="inactive">Inactive</button>
    </div>
    <div class="match-list" id="match-list"></div>
  </div>

  <!-- Main -->
  <div class="main" id="main-content">
    <div class="empty-state">
      <div class="icon">&#x1F525;</div>
      <p>Select a match to view details</p>
    </div>
  </div>
</div>

<script>
const isFileMode = window.location.protocol === 'file:';
const API = '';
let currentMatchId = null;
let currentTab = 'conversation';
let allMatches = [];
let currentFilter = 'all';
let isKilled = false;

// --- localStorage persistence for auto-messaging ---
function loadAutoStates() {
  try {
    const saved = localStorage.getItem('autoMessagingStates');
    return saved ? JSON.parse(saved) : {};
  } catch(e) { return {}; }
}
function saveAutoState(matchId, value) {
  try {
    const states = loadAutoStates();
    states[matchId] = value;
    localStorage.setItem('autoMessagingStates', JSON.stringify(states));
  } catch(e) {}
}
function applyAutoStates(matches) {
  const states = loadAutoStates();
  matches.forEach(function(m) {
    if (states.hasOwnProperty(m.match_id)) {
      m.auto_messaging = states[m.match_id];
    }
  });
}

// --- localStorage persistence for kill switch ---
function loadKillState() {
  try {
    const saved = localStorage.getItem('killSwitchState');
    return saved !== null ? JSON.parse(saved) : null;
  } catch(e) { return null; }
}
function saveKillState(killed) {
  try {
    localStorage.setItem('killSwitchState', JSON.stringify(killed));
  } catch(e) {}
}

// --- Data fetching (with graceful fallbacks for file:// mode) ---
async function fetchStats() {
  try {
    const res = await fetch(`${API}/api/stats`);
    return res.json();
  } catch(e) { return { total: 0, messages_sent_total: 0, dates_confirmed: 0, by_status: {} }; }
}

async function fetchMatches() {
  try {
    const res = await fetch(`${API}/api/matches`);
    return res.json();
  } catch(e) { return []; }
}

async function fetchConversation(matchId) {
  try {
    const res = await fetch(`${API}/api/matches/${matchId}/conversation`);
    return res.json();
  } catch(e) { return { match: null, conversation: [] }; }
}

async function sendMessage(matchId, message) {
  try {
    const res = await fetch(`${API}/api/matches/${matchId}/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });
    return res.json();
  } catch(e) { return { success: false }; }
}

async function approveDate(matchId) {
  try {
    const res = await fetch(`${API}/api/matches/${matchId}/approve-date`, { method: 'POST' });
    return res.json();
  } catch(e) { return { success: false }; }
}

async function rejectDate(matchId) {
  try {
    const res = await fetch(`${API}/api/matches/${matchId}/reject-date`, { method: 'POST' });
    return res.json();
  } catch(e) { return { success: false }; }
}

async function stopMatch(matchId) {
  try {
    const res = await fetch(`${API}/api/matches/${matchId}/stop`, { method: 'POST' });
    return res.json();
  } catch(e) { return { success: false }; }
}

async function resumeMatch(matchId) {
  try {
    const res = await fetch(`${API}/api/matches/${matchId}/resume`, { method: 'POST' });
    return res.json();
  } catch(e) { return { success: false }; }
}

async function toggleAutoMessaging(matchId) {
  try {
    const res = await fetch(`${API}/api/matches/${matchId}/auto-messaging`, { method: 'POST' });
    return res.json();
  } catch(e) { return { success: false }; }
}

// --- Rendering ---

function timeSince(dateStr) {
  if (!dateStr) return '-';
  const seconds = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
  if (seconds < 60) return 'now';
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
  if (seconds < 86400) return Math.floor(seconds / 3600) + 'h';
  return Math.floor(seconds / 86400) + 'd';
}

function filterMatches(matches, filter) {
  switch (filter) {
    case 'active':
      return matches.filter(m => ['new','opener_sent','chatting','date_proposed','date_pending'].includes(m.status));
    case 'dates':
      return matches.filter(m => ['date_proposed','date_pending','date_confirmed','date_rejected'].includes(m.status));
    case 'inactive':
      return matches.filter(m => ['ghosted','unmatched','stopped'].includes(m.status));
    default:
      return matches;
  }
}

function renderMatchList(matches) {
  const list = document.getElementById('match-list');
  const filtered = filterMatches(matches, currentFilter);

  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-matches">No matches found</div>';
    return;
  }

  list.innerHTML = filtered.map(m => `
    <div class="match-item ${m.match_id === currentMatchId ? 'active' : ''} ${m.status === 'date_pending' ? 'needs-action' : ''}"
         onclick="selectMatch('${m.match_id}')">
      <div class="match-avatar">${m.name.charAt(0)}</div>
      <div class="match-info">
        <div class="match-name">${esc(m.name)}</div>
        <div class="match-preview">${m.messages_sent + m.messages_received} messages</div>
      </div>
      <div class="match-meta">
        <div class="match-time">${timeSince(m.last_message_at)}</div>
        <span class="badge badge-${m.status}">${m.status.replace(/_/g, ' ')}</span>
      </div>
    </div>
  `).join('');
}

function renderStats(stats) {
  document.getElementById('stat-total').textContent = stats.total;
  document.getElementById('stat-messages').textContent = stats.messages_sent_total;
  document.getElementById('stat-dates').textContent = stats.dates_confirmed;
}

function renderDetail(match, conversation) {
  const main = document.getElementById('main-content');
  const isPending = match.status === 'date_pending';
  const isStopped = match.status === 'stopped';

  let alertHtml = '';
  if (isPending) {
    alertHtml = `
      <div class="alert-banner">
        <span class="alert-icon">&#x1F389;</span>
        <span class="alert-text"><strong>${esc(match.name)}</strong> said yes to a date! ${match.date_details ? '(' + esc(match.date_details) + ')' : ''}</span>
        <div class="alert-actions">
          <button class="btn btn-success" onclick="handleApprove('${match.match_id}')">Approve</button>
          <button class="btn btn-danger" onclick="handleReject('${match.match_id}')">Decline</button>
        </div>
      </div>`;
  }

  main.innerHTML = `
    ${alertHtml}
    <div class="detail-header">
      <div class="detail-header-left">
        <div class="detail-avatar">${match.name.charAt(0)}</div>
        <div>
          <div class="detail-name">${esc(match.name)}</div>
          <div class="detail-sub">
            <span class="badge badge-${match.status}">${match.status.replace(/_/g, ' ')}</span>
            &nbsp; ${match.messages_sent} sent / ${match.messages_received} received
            ${match.followups_sent > 0 ? ' &middot; ' + match.followups_sent + ' follow-ups' : ''}
          </div>
        </div>
      </div>
      <div class="detail-actions">
        <span style="font-size:13px;color:var(--text-dim);font-weight:600;">Auto-Messaging</span>
        <div class="toggle ${match.auto_messaging ? 'active' : ''}" onclick="handleAutoToggle('${match.match_id}')">
          <span class="toggle-slider"></span>
        </div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab ${currentTab === 'conversation' ? 'active' : ''}" onclick="switchTab('conversation')">Conversation</div>
      <div class="tab ${currentTab === 'profile' ? 'active' : ''}" onclick="switchTab('profile')">Profile Analysis</div>
      <div class="tab ${currentTab === 'stats' ? 'active' : ''}" onclick="switchTab('stats')">Details</div>
    </div>
    <div id="tab-content"></div>
  `;

  renderTab(match, conversation);
}

function renderTab(match, conversation) {
  const container = document.getElementById('tab-content');
  if (!container) return;

  if (currentTab === 'conversation') {
    const msgs = conversation.map(m => `
      <div class="msg ${m.role === 'assistant' ? 'msg-bot' : 'msg-match'}">
        ${esc(m.content)}
        <div class="msg-time">${new Date(m.timestamp).toLocaleString()}</div>
      </div>
    `).join('');

    container.innerHTML = `
      <div class="conversation" id="convo-scroll"><div class="convo-inner">${msgs || '<div class="no-matches">No messages yet</div>'}</div></div>
      <div class="msg-input-bar">
        <input class="msg-input" id="msg-input" placeholder="Send a manual message..." onkeydown="if(event.key==='Enter')handleSend()">
        <button class="btn btn-primary" onclick="handleSend()">Send</button>
      </div>
    `;

    // Scroll to bottom — wait for layout to finish
    requestAnimationFrame(function() {
      const scroll = document.getElementById('convo-scroll');
      if (scroll) scroll.scrollTop = scroll.scrollHeight;
    });

  } else if (currentTab === 'profile') {
    container.innerHTML = `
      <div class="profile-panel">
        <div class="profile-section">
          <h3>AI Profile Analysis</h3>
          <pre>${esc(match.profile_summary || 'No analysis available.')}</pre>
        </div>
      </div>
    `;

  } else if (currentTab === 'stats') {
    container.innerHTML = `
      <div class="profile-panel">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="value" style="color:var(--blue)">${match.messages_sent}</div>
            <div class="label">Messages Sent</div>
          </div>
          <div class="stat-card">
            <div class="value" style="color:var(--green)">${match.messages_received}</div>
            <div class="label">Messages Received</div>
          </div>
          <div class="stat-card">
            <div class="value" style="color:var(--yellow)">${match.followups_sent}</div>
            <div class="label">Follow-ups</div>
          </div>
          <div class="stat-card">
            <div class="value" style="color:var(--accent)">${match.status.replace(/_/g, ' ')}</div>
            <div class="label">Current Status</div>
          </div>
        </div>
        <div class="profile-section">
          <h3>Match ID</h3>
          <p style="font-family:monospace; font-size:12px; color:var(--text-dim)">${match.match_id}</p>
        </div>
        ${match.date_details ? `
          <div class="profile-section">
            <h3>Date Details</h3>
            <p>${esc(match.date_details)}</p>
          </div>
        ` : ''}
        <div class="profile-section">
          <h3>Timeline</h3>
          <p>Matched: ${new Date(match.created_at).toLocaleString()}</p>
          <p>Last update: ${new Date(match.updated_at).toLocaleString()}</p>
          ${match.last_message_at ? `<p>Last message: ${new Date(match.last_message_at).toLocaleString()}</p>` : ''}
        </div>
      </div>
    `;
  }
}

// --- Actions ---

async function selectMatch(matchId) {
  currentMatchId = matchId;
  currentTab = 'conversation';
  const data = await fetchConversation(matchId);
  // Apply locally-persisted auto_messaging state
  const local = allMatches.find(x => x.match_id === matchId);
  if (local && data.match) data.match.auto_messaging = local.auto_messaging;
  renderMatchList(allMatches);
  renderDetail(data.match, data.conversation);
}

function switchTab(tab) {
  currentTab = tab;
  if (currentMatchId) {
    // Re-render without resetting tab to 'conversation'
    fetchConversation(currentMatchId).then(function(data) {
      const local = allMatches.find(x => x.match_id === currentMatchId);
      if (local && data.match) data.match.auto_messaging = local.auto_messaging;
      renderDetail(data.match, data.conversation);
    });
  }
}

async function handleAutoToggle(matchId) {
  const m = allMatches.find(x => x.match_id === matchId);
  if (m) m.auto_messaging = !m.auto_messaging;
  // Persist to localStorage so it survives refresh
  if (m) saveAutoState(matchId, m.auto_messaging);
  // Fire API call in background (server also updates its state)
  toggleAutoMessaging(matchId).catch(function(){});
  if (currentMatchId === matchId) {
    const data = await fetchConversation(matchId);
    if (m) data.match.auto_messaging = m.auto_messaging;
    renderMatchList(allMatches);
    renderDetail(data.match, data.conversation);
  }
}

async function handleSend() {
  const input = document.getElementById('msg-input');
  if (!input || !input.value.trim() || !currentMatchId) return;
  const msg = input.value.trim();
  input.value = '';
  await sendMessage(currentMatchId, msg);
  await refresh();
  selectMatch(currentMatchId);
}

async function handleApprove(matchId) {
  if (!confirm('Approve this date?')) return;
  await approveDate(matchId);
  await refresh();
  selectMatch(matchId);
}

async function handleReject(matchId) {
  if (!confirm('Decline this date?')) return;
  await rejectDate(matchId);
  await refresh();
  selectMatch(matchId);
}

async function handleKillSwitch() {
  const nowKilled = !isKilled;
  if (isFileMode) {
    updateKillUI(nowKilled);
    saveKillState(nowKilled);
    return;
  }
  try {
    const res = await fetch(`${API}/api/bot/kill`, { method: 'POST' });
    const data = await res.json();
    updateKillUI(data.killed);
    saveKillState(data.killed);
    if (data.killed) await refresh();
  } catch(e) {
    updateKillUI(nowKilled);
    saveKillState(nowKilled);
  }
}

function updateKillUI(killed) {
  isKilled = killed;
  const toggle = document.getElementById('kill-toggle');
  const barStatus = document.getElementById('kill-bar-status');
  if (killed) {
    toggle.classList.remove('active');
    barStatus.textContent = 'STOPPED';
    barStatus.className = 'kill-bar-status off';
  } else {
    toggle.classList.add('active');
    barStatus.textContent = 'ACTIVE';
    barStatus.className = 'kill-bar-status on';
  }
}

async function handleStop(matchId) {
  await stopMatch(matchId);
  await refresh();
  selectMatch(matchId);
}

async function handleResume(matchId) {
  await resumeMatch(matchId);
  await refresh();
  selectMatch(matchId);
}

// --- Filters ---
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderMatchList(allMatches);
  });
});

// --- Escape HTML ---
function esc(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- Init & live updates ---

async function refresh() {
  const [stats, matches] = await Promise.all([fetchStats(), fetchMatches()]);
  applyAutoStates(matches);
  allMatches = matches;
  renderStats(stats);
  renderMatchList(matches);
}

// SSE for live updates
function connectSSE() {
  try {
    const es = new EventSource(`${API}/api/events`);
    es.addEventListener('update', (e) => {
      const data = JSON.parse(e.data);
      allMatches = data.matches;
      renderStats(data.stats);
      renderMatchList(data.matches);
      if (data.killed !== undefined) updateKillUI(data.killed);
    });
    es.addEventListener('kill_switch', (e) => {
      const data = JSON.parse(e.data);
      updateKillUI(data.killed);
      if (data.killed) refresh();
    });
    es.onerror = () => {
      es.close();
      setTimeout(connectSSE, 10000);
    };
  } catch(e) { /* SSE not available in file:// mode */ }
}

// Initial load
async function init() {
  if (isFileMode) {
    renderStats({ total: 0, messages_sent_total: 0, dates_confirmed: 0 });
    renderMatchList([]);
    // Restore kill switch from localStorage
    const savedKill = loadKillState();
    if (savedKill !== null) updateKillUI(savedKill);
    return;
  }
  await refresh();
  // Check server kill state first, fall back to localStorage
  try {
    const statusRes = await fetch(`${API}/api/bot/status`);
    const statusData = await statusRes.json();
    updateKillUI(statusData.killed);
    saveKillState(statusData.killed);
  } catch(e) {
    const savedKill = loadKillState();
    if (savedKill !== null) updateKillUI(savedKill);
  }
  connectSSE();
}
init();

// --- Live reload (auto-refreshes browser when dev.py detects file changes) ---
(function() {
  var lastHash = null;
  setInterval(function() {
    fetch('/__hash').then(function(r) { return r.json(); }).then(function(d) {
      if (lastHash && lastHash !== d.h) location.reload();
      lastHash = d.h;
    }).catch(function() {});
  }, 2000);
})();
</script>
